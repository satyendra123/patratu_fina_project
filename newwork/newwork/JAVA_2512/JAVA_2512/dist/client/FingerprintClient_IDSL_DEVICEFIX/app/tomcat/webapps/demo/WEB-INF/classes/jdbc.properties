# Active database: Microsoft SQL Server (fixed TCP port, SQL Authentication)
driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
url=jdbc:sqlserver://localhost:1433;databaseName=IDSL_NTPC_CLIMS;encrypt=true;trustServerCertificate=true
username=YOUR_SQL_USER
password=YOUR_SQL_PASSWORD
initialSize=2
maxActive=40
maxIdle=12
minIdle=2
maxWait=15000
validationQuery=SELECT 1
testOnBorrow=true
testWhileIdle=true
timeBetweenEvictionRunsMillis=30000
numTestsPerEvictionRun=5
minEvictableIdleTimeMillis=120000
removeAbandoned=true
removeAbandonedTimeout=180
logAbandoned=false
